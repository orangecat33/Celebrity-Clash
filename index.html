<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100e17">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Celebrity Clash"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
</head><body>
<title>Celebrity Clash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Unbounded:wght@600;800&family=Bebas+Neue&family=Playfair+Display:wght@900&family=Cinzel:wght@900&family=Orbitron:wght@900&family=Righteous&family=Pacifico&family=Lobster&family=Permanent+Marker&family=Caveat:wght@700&family=Press+Start+2P&display=swap">
<style>
/* Layout: mobile-first, bottom tab bar, dark full-screen stage for opening and a 3D card viewer. */
:root{
  --bg:#f3f1f6; --surface:#ffffff; --surface2:#e9e6f1; --fg:#1b1726; --muted:#675f79; --line:#d8d3e4;
  --accent:#d92d5f; --accent-fg:#ffffff; --danger:#c62828;
  --display:"Unbounded","Manrope",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#100e17; --surface:#1a1724; --surface2:#262234; --fg:#f1eef8; --muted:#a099b3; --line:#2f2a42;
  --accent:#ff5c8a; --accent-fg:#1a0a12; --danger:#ff7a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100e17; --surface:#1a1724; --surface2:#262234; --fg:#f1eef8; --muted:#a099b3; --line:#2f2a42;
  --accent:#ff5c8a; --accent-fg:#1a0a12; --danger:#ff7a7a; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font:800 22px/1.1 var(--display);margin:6px 0 16px;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 16px/1.2 var(--display);margin:0 0 6px;text-wrap:balance}
p{margin:0 0 10px}
.muted{color:var(--muted)}
main{max-width:720px;margin:0 auto}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.dng{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.dng.armed{background:var(--danger);color:var(--bg)}
.btn.big{width:100%;font-size:17px;padding:15px;border-radius:14px}
.btn.sm{min-height:36px;padding:6px 14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row>.btn{flex:1 1 130px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar>.btn{flex:1 1 150px}
.fbtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.fbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}

[hidden]{display:none!important}
/* ---------- card ---------- */
.card{position:relative;display:block;aspect-ratio:5/7;border-radius:12px;overflow:visible;background:var(--surface2);
  border:2px solid var(--rc,#8e8aa0);isolation:isolate;container-type:inline-size}
.card .cin{position:absolute;inset:0;display:block;border-radius:10px;overflow:hidden}
.card .ser{position:absolute;top:16cqw;display:block;writing-mode:vertical-rl;background:var(--rc);color:var(--rt,#111);z-index:1;white-space:nowrap;
  font:800 clamp(7px,4.4cqw,15px)/1 var(--body);letter-spacing:.06em;padding:2.4cqw 1.5cqw;font-variant-numeric:tabular-nums;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.card .ser.r{left:calc(100% + 2px);border-radius:0 2cqw 2cqw 0}
.card .ser.l{right:calc(100% + 2px);border-radius:2cqw 0 0 2cqw;transform:rotate(180deg)}
.mini .ser,.lprev .ser{display:none}
.card .art{position:absolute;inset:0;background-size:cover;background-position:center top;display:block}
.card .art.ph{background:linear-gradient(160deg,hsl(var(--ph) 60% 46%),hsl(calc(var(--ph) + 50) 55% 24%));display:grid;place-items:center}
.card .art.ph span{font:800 38cqw/1 var(--display);color:rgba(255,255,255,.55)}
.card .cap{position:absolute;left:0;right:0;bottom:0;display:block;padding:14cqw 6cqw 5cqw;color:#fff;text-align:center;
  font-family:var(--cf);font-weight:var(--cw);font-size:clamp(9px,calc(8cqw*var(--fm,1)),46px);line-height:1.1;
  background:linear-gradient(transparent,rgba(0,0,0,.86));text-shadow:0 1px 3px rgba(0,0,0,.8);overflow-wrap:anywhere;text-wrap:balance;z-index:3}
.card .cset{display:block;margin-top:1.5cqw;font:700 clamp(7px,4.2cqw,18px)/1.2 var(--body);opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.card .rar{position:absolute;top:2.5cqw;left:2.5cqw;display:block;max-width:62%;padding:.6cqw 2.6cqw;border-radius:2cqw;background:var(--rc);color:var(--rt,#111);
  font:800 clamp(7px,4.2cqw,16px)/1.4 var(--body);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3}
.card .cnt,.card .new{position:absolute;top:2.5cqw;right:2.5cqw;display:block;z-index:3;font:800 clamp(9px,5cqw,18px)/1.5 var(--body);padding:0 2.6cqw;border-radius:99px}
.card .cnt{background:rgba(0,0,0,.72);color:#fff}
.card .new{background:var(--accent);color:var(--accent-fg);border-radius:2cqw;letter-spacing:.05em}
.card.unk{border-color:var(--line);background:var(--surface2)}
.card.unk .q{position:absolute;inset:0;display:grid;place-items:center;font:800 34cqw var(--display);color:var(--line)}

/* ---------- card add-ons ---------- */
.fx{position:absolute;inset:0;pointer-events:none;display:block;border-radius:inherit;z-index:2}
.fx-holo{background:linear-gradient(115deg,#ff2d95,#ff9a00,#ffe600,#22e07a,#19b5ff,#8a5cff,#ff2d95);background-size:300% 100%;mix-blend-mode:overlay;animation:slide 6s linear infinite}
.fx-chrome{background:linear-gradient(120deg,rgba(255,255,255,.15) 0%,rgba(255,255,255,.9) 16%,rgba(60,72,95,.55) 28%,rgba(255,255,255,.95) 42%,rgba(35,45,70,.6) 56%,rgba(255,255,255,.9) 70%,rgba(255,255,255,.15) 100%);background-size:260% 100%;mix-blend-mode:overlay;animation:slide 5s linear infinite}
.fx-shine{background:linear-gradient(115deg,transparent 34%,var(--fc,#fff) 50%,transparent 66%);background-size:260% 100%;animation:slide 3.8s linear infinite}
.fx-glowin{animation:pulse 2.4s ease-in-out infinite}
.fx-frame{border:2.8cqw solid #e0b13a;box-shadow:inset 0 0 0 .7cqw rgba(255,255,255,.6),inset 0 0 4cqw rgba(0,0,0,.45)}
.fx-sp1{animation:tw 2.4s ease-in-out infinite alternate}
.fx-sp2{animation:tw 2.4s ease-in-out -1.2s infinite alternate}
@keyframes slide{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes tw{from{opacity:.1}to{opacity:1}}
.tilt .fx-holo,.tilt .fx-chrome,.tilt .fx-shine{animation:none;background-position:var(--gx,50%) var(--gy,50%)}
.fx-flame,.fx-rain,.fx-snow{overflow:hidden}
.fx-flame{mix-blend-mode:normal}
.fx-flame::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(transparent,color-mix(in srgb,var(--fc) 65%,transparent))}
.fx-flame i{position:absolute;bottom:-6cqw;margin-left:-10cqw;border-radius:50% 50% 45% 45%/85% 85% 25% 25%;transform-origin:50% 100%;
  background:radial-gradient(ellipse at 50% 88%,#fffbe0 0,#ffe066 22%,var(--fc) 52%,transparent 78%);animation:flick .9s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,.82) skewX(-5deg)}50%{transform:scale(.9,1.06) skewX(4deg)}100%{transform:scale(1.06,.9) skewX(-3deg)}}
.fx-foil{mix-blend-mode:hard-light;background:
  repeating-linear-gradient(35deg,rgba(255,255,255,.18) 0 .5cqw,rgba(0,0,0,.1) .5cqw 1.6cqw,transparent 1.6cqw 3.6cqw),
  repeating-linear-gradient(125deg,var(--fc) 0 2.2cqw,color-mix(in srgb,var(--fc) 45%,#fff) 2.2cqw 3.4cqw,color-mix(in srgb,var(--fc) 65%,#000) 3.4cqw 5.6cqw)}
.fx-foil::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.9) 50%,transparent 70%);background-size:260% 100%;animation:slide 4s linear infinite}
.tilt .fx-foil::after{animation:none;background-position:var(--gx,50%) var(--gy,50%)}
.fx-rain i{position:absolute;top:0;width:.4cqw;height:11cqw;border-radius:1cqw;background:linear-gradient(transparent,var(--fc));opacity:.85;animation:rainf linear infinite}
@keyframes rainf{from{transform:translateY(-14cqw) rotate(10deg)}to{transform:translateY(152cqw) rotate(10deg)}}
.fx-snow i{position:absolute;top:0;border-radius:50%;background:var(--fc);box-shadow:0 0 1cqw var(--fc);opacity:.92;animation:snowf linear infinite}
@keyframes snowf{from{transform:translate(0,-6cqw)}50%{transform:translate(3cqw,70cqw)}to{transform:translate(-1cqw,152cqw)}}
.fx-aurora{mix-blend-mode:screen;background:linear-gradient(180deg,transparent 5%,var(--fc) 35%,#46f0c8 55%,#9b6bff 75%,transparent 95%);background-size:100% 220%;animation:aur 7s ease-in-out infinite alternate,hue 14s linear infinite}
@keyframes aur{from{background-position:0 0}to{background-position:0 100%}}
@keyframes hue{to{filter:hue-rotate(360deg)}}

/* ---------- grids, chips, lists ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:6px 2px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:720px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.cb{display:block;width:100%;padding:0;border:0;background:none;text-align:left;min-width:0}
.cb:active .card{transform:scale(.97)}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--rc,var(--surface2));color:var(--rt,var(--fg));font:800 11.5px/1.5 var(--body)}
.chip.plain{background:var(--surface2);color:var(--fg);border:1.5px solid transparent;cursor:pointer;padding:6px 12px;font-size:12.5px;white-space:nowrap}
.chip.plain.on{background:var(--fg);color:var(--bg)}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:4px}
.chips .chip{flex:0 0 auto}
.empty{padding:28px 18px;border:1.5px dashed var(--line);border-radius:16px;text-align:center}
.warn{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--danger) 16%,var(--surface));border:1.5px solid var(--danger);margin-bottom:14px;font-size:13.5px}
.note{padding:10px 12px;border-radius:12px;background:var(--surface2);margin-bottom:14px;font-size:13.5px}
.note[hidden]{display:none}
.prog{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font:800 20px var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--muted)}
.set{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.sh h2{margin:0}
.lrow{display:flex;align-items:center;gap:6px;margin-top:8px}
.lmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);min-height:48px}
.lmain b{flex:1;min-width:0;overflow-wrap:anywhere}
.dot{flex:0 0 18px;height:18px;border-radius:50%;background:var(--rc);border:2px solid color-mix(in srgb,var(--fg) 25%,transparent)}
.ic{flex:0 0 40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:13px}
.lprev{flex:0 0 36px}
.lprev .cap,.lprev .rar,.mini .cap,.mini .rar{display:none}

/* ---------- packs ---------- */
.pack{position:relative;display:block;aspect-ratio:2/3;border-radius:10px;overflow:hidden;color:#fff;
  background:linear-gradient(165deg,hsl(var(--h) 85% 58%),hsl(calc(var(--h) + 35) 80% 32%));box-shadow:0 10px 22px rgba(0,0,0,.3)}
.pack::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.13) 0 2px,transparent 2px 14px)}
.pack::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 3px,rgba(255,255,255,.2) 3px 6px)}
.pack .strip{position:absolute;left:0;right:0;top:0;height:8%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 3px,rgba(255,255,255,.2) 3px 6px);transform-origin:left top;z-index:2}
.pack .pn{position:absolute;left:9%;right:9%;top:32%;display:block;text-align:center;font:800 clamp(12px,4.4vw,19px)/1.15 var(--display);text-shadow:0 2px 8px rgba(0,0,0,.45);overflow-wrap:anywhere;text-wrap:balance;z-index:1}
.pack .pc{position:absolute;left:0;right:0;bottom:12%;display:block;text-align:center;font:800 10px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.92;z-index:1}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 4px 16px;margin:0 -4px 6px}
.packbtn{flex:0 0 118px;scroll-snap-align:center;padding:0;border:0;background:none;opacity:.6;transform:scale(.94);transition:transform .2s,opacity .2s}
.packbtn.on{opacity:1;transform:scale(1)}
.packbtn.on .pack{box-shadow:0 0 0 3px var(--accent),0 12px 26px rgba(0,0,0,.35)}
.info{margin:2px 0 16px}
.prow{display:flex;gap:14px;align-items:center;padding:12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);margin-bottom:10px;width:100%;text-align:left}
.prow .pack{flex:0 0 58px;border-radius:7px;box-shadow:none}
.prow .pack .pn,.prow .pack .pc{display:none}
.prow .meta{min-width:0;flex:1}
.prow .meta b{display:block;font:700 15px var(--display);overflow-wrap:anywhere}
details.det{margin-top:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:4px 12px}
details.det summary{cursor:pointer;font-weight:700;padding:10px 0}
.drow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.drow span.nm{flex:1;min-width:0;overflow-wrap:anywhere}
.drow b{font-variant-numeric:tabular-nums}

/* ---------- nav, sheet, toast ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1.5px solid var(--line);
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;min-width:0;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font:700 10px var(--body)}
.nav button.on{color:var(--accent)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,6,14,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .box{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));border:1.5px solid var(--line);border-bottom:0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:600px){.sheet{align-items:center}.sheet .box{border-radius:20px;border-bottom:1.5px solid var(--line)}}
.fl{display:block;margin:14px 0 6px;font:800 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],select{width:100%;font:600 16px var(--body);padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.prev{width:min(46vw,170px);margin:6px auto 10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font:800 12px var(--body)}
.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line)}
.chk input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;background:var(--c);box-shadow:0 0 0 1px var(--line)}
.sw button.on{border-color:var(--fg)}
.sw input[type=color]{width:44px;height:36px;padding:0;border:1.5px solid var(--line);border-radius:10px;background:none}
.hsw button{background:hsl(var(--h) 80% 52%)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font:800 20px var(--body)}
.stepper output{min-width:36px;text-align:center;font:800 20px var(--display);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fonts button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 6px;font-size:17px;min-height:44px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fonts button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pr2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--bg)}
.pr2 label{display:flex;gap:10px;align-items:center;min-width:0}
.pr2 input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}
.pr2 .mini{flex:0 0 34px}
.pr2 .nm{min-width:0;font-weight:700;overflow-wrap:anywhere;font-size:14px}
.pr2 .nm .chip{display:block;width:fit-content;margin-top:2px;font-size:10.5px;padding:1px 7px}
.wbox{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:112px}
.wbox input{width:70px;padding:8px;text-align:right}
.wbox small{width:100%;text-align:right;color:var(--muted);font-weight:700;font-size:11.5px;min-height:14px}
.sumline{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--surface2);font-weight:700;font-size:13.5px}
.sumline.bad{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border:1.5px solid var(--accent)}
.cmsg{font-size:16px;margin:4px 0 6px}
.wallet{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);margin-bottom:14px;font-weight:700}
.wallet b{font:800 17px var(--display);font-variant-numeric:tabular-nums}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--surface)}
.srow .mini{flex:0 0 38px;display:block}
.srow .meta{flex:1 1 150px;min-width:0;font-size:14px;overflow-wrap:anywhere}
.srow .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.shopitem{display:flex;flex-direction:column;gap:6px;min-width:0}

  if(j.econ&&typeof j.econ==='object')out.econ={on:!!j.econ.on,name:String(j.econ.name||'monet').slice(0,20),sellLast:!!j.econ.sellLast};
  out.rarities=(v2&&Array.isArray(j.rarities)&&j.rarities.length)
    ?j.rarities.slice(0,30).map(r=>({id:String(r.id||uid()),name:String(r.name||'Rzadkość').slice(0,30),color:okCol(r.color,'#8e8aa0'),sell:r.sell,buy:r.buy})):clone(DEFAULT_RAR);
  out.effects=(v2&&Array.isArray(j.effects))
    ?j.effects.slice(0,40).map(e=>({id:String(e.id||uid()),name:String(e.name||'Dodatek').slice(0,30),kind:KINDS.some(k=>k[0]===e.kind)?e.kind:'shine',color:okCol(e.color,'#ffffff'),strength:clamp(+e.strength||60,5,100)})):clone(DEFAULT_FX);
  if(v2&&Array.isArray(j.effects)&&(+j.fxv||1)<2)NEW_FX.forEach(e=>{if(!out.effects.some(x=>x.id===e.id))out.effects.push(clone(e))});
  if(v2&&Array.isArray(j.sets))out.sets=j.sets.slice(0,60).map(s=>({id:String(s.id||uid()),name:String(s.name||'Kolekcja').slice(0,40)}));
  out.rarities.forEach(r=>{r.sell=price(r.sell);r.buy=price(r.buy)});
  const rids=out.rarities.map(r=>r.id),sids=out.sets.map(s=>s.id),eids=out.effects.map(e=>e.id),seen={};
  (Array.isArray(j.cards)?j.cards:[]).forEach(c=>{
    const id=String(c.id||uid());if(seen[id])return;seen[id]=1;
    let rarityId,effectIds=[];
    if(v2){rarityId=rids.includes(String(c.rarityId))?String(c.rarityId):rids[0];
      effectIds=(Array.isArray(c.effectIds)?c.effectIds:[]).map(String).filter(x=>eids.includes(x))}
    else{const ri=clamp(c.rarity|0,0,3);rarityId=rids[Math.min(ri,rids.length-1)];
      if(ri>=1)effectIds.push('fx-shine');if(ri===3)effectIds.push('fx-glow');effectIds=effectIds.filter(x=>eids.includes(x))}
    out.cards.push({id,name:String(c.name||'').slice(0,60),rarityId,setId:(v2&&sids.includes(String(c.setId)))?String(c.setId):null,effectIds,
      font:FONTS.some(f=>f.k===c.font)?c.font:'Manrope',img:(typeof c.img==='string'&&IMG_RE.test(c.img))?c.img:null,sell:priceOrNull(c.sell),buy:priceOrNull(c.buy),print:clamp(c.print|0,0,100000),serSide:c.serSide==='l'?'l':'r',pub:c.pub!==false,sample:!!c.sample});
  });
  const cids=out.cards.map(c=>c.id);
  (Array.isArray(j.packs)?j.packs:[]).forEach(p=>{
    let entries=[];
    if(v2){entries=(Array.isArray(p.entries)?p.entries:[]).filter(e=>cids.includes(String(e.id))).map(e=>({id:String(e.id),w:clamp(Math.round((+e.w||0)*10000)/10000,0,1000)}))}
    else{
      const ids=(Array.isArray(p.cardIds)?p.cardIds:[]).map(String).filter(x=>cids.includes(x));
      const ri=id=>Math.max(0,rids.indexOf(out.cards.find(c=>c.id===id).rarityId));
      const wts=[0,1,2,3].map(i=>Math.max(0,+(p.weights&&p.weights[i])||0)),cnt=[0,0,0,0];
      ids.forEach(id=>{cnt[Math.min(3,ri(id))]++});
      let raw=ids.map(id=>{const i=Math.min(3,ri(id));return cnt[i]?wts[i]/cnt[i]:0}),sum=raw.reduce((a,b)=>a+b,0);
      if(sum<=0){raw=ids.map(()=>1);sum=ids.length}
      entries=ids.map((id,k)=>({id,w:Math.round(raw[k]/sum*10000)/100}));
    }
    out.packs.push({id:String(p.id||uid()),name:String(p.name||'Paczka').slice(0,40),hue:(+p.hue||345),size:clamp(p.size|0||5,1,15),norep:!!p.norep,price:price(p.price),pub:p.pub!==false,sample:!!p.sample,entries});
  });
  if(j.owned&&typeof j.owned==='object')Object.keys(j.owned).forEach(k=>{const n=j.owned[k]|0;if(n>0&&cids.includes(k))out.owned[k]=n});
  ['serials','taken'].forEach(key=>{if(j[key]&&typeof j[key]==='object')Object.keys(j[key]).forEach(k=>{if(cids.includes(k))out[key][k]=cleanNums(j[key][k])})});
  return out;
}

let persistOk=true,dbp=null,saveT=null;
function getDb(){
  if(dbp)return dbp;
  dbp=new Promise((res,rej)=>{try{const r=indexedDB.open(CATALOG?'celebrity-clash-play-v1':'pack-opener-v1',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
  dbp.catch(()=>{dbp=null});return dbp;
}
const idbGet=k=>getDb().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result||null);t.onerror=()=>rej(t.error)}));
const idbPut=(k,v)=>getDb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)}));
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{(CATALOG?idbPut('progress',{owned:state.owned,serials:state.serials,taken:state.taken,opened:state.opened,coins:state.coins}):idbPut('state',state)).then(()=>{if(!persistOk){persistOk=true;render()}}).catch(()=>{if(persistOk){persistOk=false;render()}})},350)}

/* ===== card rendering ===== */
function sparkle(seed,col,s){
  let h=hash(seed),out='';
  for(let L=0;L<2;L++){
    const n=4+Math.round(s/20),g=[];
    for(let i=0;i<n;i++){h=(h*1664525+1013904223)>>>0;const x=h%96+2;h=(h*1664525+1013904223)>>>0;const y=h%96+2;
      g.push(`radial-gradient(circle at ${x}% ${y}%,#fff 0,#fff .7cqw,${col} 1.3cqw,transparent 3.4cqw)`)}
    out+=`<span class="fx fx-sp${L+1}" style="background-image:${g.join(',')}"></span>`;
  }
  return out;
}
function flame(seed,col,s){
  let h=hash(seed),t='';const n=6+Math.round(s/25);
  for(let i=0;i<n;i++){
    h=(h*1664525+1013904223)>>>0;
    const x=(i+.5)/n*100+(h%7-3),w=18+(h%9),dl=-((h>>4)%20)/10,du=.7+((h>>8)%6)/10;
    t+=`<i style="left:${x.toFixed(1)}%;width:${w}cqw;height:${(36+s*.3).toFixed(0)}cqw;animation-delay:${dl}s;animation-duration:${du}s"></i>`;
  }
  return `<span class="fx fx-flame" style="--fc:${col};opacity:${(.5+s/100*.5).toFixed(2)}">${t}</span>`;
}
function drops(kind,seed,col,s){
  let h=hash(seed),t='';const n=7+Math.round(s/7);
  for(let i=0;i<n;i++){
    h=(h*1664525+1013904223)>>>0;const x=h%100;
    h=(h*1664525+1013904223)>>>0;
    const du=kind==='rain'?.7+(h%8)/10:3.2+(h%30)/10,dl=-((h>>5)%30)/10;
    const sz=kind==='snow'?`width:${(1+(h%4)/2).toFixed(1)}cqw;height:${(1+(h%4)/2).toFixed(1)}cqw;`:'';
    t+=`<i style="left:${x}%;${sz}animation-duration:${du.toFixed(2)}s;animation-delay:${dl}s"></i>`;
  }
  return `<span class="fx fx-${kind}" style="--fc:${col}">${t}</span>`;
}
function fxOf(c){
  let layers='';const sh=['0 2px 8px rgba(0,0,0,.32)'];
  (c.effectIds||[]).forEach(id=>{
    const e=effById(id);if(!e)return;
    const s=clamp(+e.strength||60,5,100),col=e.color;
    if(e.kind==='holo')layers+=`<span class="fx fx-holo" style="opacity:${(.2+s/100*.75).toFixed(2)}"></span>`;
    else if(e.kind==='chrome')layers+=`<span class="fx fx-chrome" style="opacity:${(.25+s/100*.75).toFixed(2)}"></span>`;
    else if(e.kind==='shine')layers+=`<span class="fx fx-shine" style="opacity:${(.3+s/100*.7).toFixed(2)};--fc:${col}"></span>`;
    else if(e.kind==='glow'){sh.push(`0 0 ${(6+s*.34).toFixed(0)}px ${(s*.04).toFixed(1)}px ${col}`);
      layers+=`<span class="fx fx-glowin" style="box-shadow:inset 0 0 ${(6+s*.26).toFixed(0)}px ${col}"></span>`}
    else if(e.kind==='sparkle')layers+=sparkle(c.id+e.id,col,s);
    else if(e.kind==='frame')layers+=`<span class="fx fx-frame" style="border-color:${col}"></span>`;
    else if(e.kind==='flame')layers+=flame(c.id+e.id,col,s);
    else if(e.kind==='foil')layers+=`<span class="fx fx-foil" style="opacity:${(.2+s/100*.55).toFixed(2)};--fc:${col}"></span>`;
    else if(e.kind==='rain'||e.kind==='snow')layers+=drops(e.kind,c.id+e.id,col,s);
    else if(e.kind==='aurora')layers+=`<span class="fx fx-aurora" style="opacity:${(.25+s/100*.6).toFixed(2)};--fc:${col}"></span>`;
  });
  return {layers,shadow:sh.join(',')};
}

/* ===== packs: odds and drawing ===== */
function poolOf(p){
  const items=p.entries.map(e=>({c:byId(e.id),w:Math.max(0,+e.w||0)})).filter(x=>x.c);
  items.forEach(x=>{x.sold=isSold(x.c)});
  const live=items.filter(x=>!x.sold);
  let sum=live.reduce((a,x)=>a+x.w,0);
  if(live.length&&sum<=0){live.forEach(x=>{x.w=1});sum=live.length}
  items.forEach(x=>{x.pct=(!x.sold&&sum)?x.w/sum*100:0});
  return items;
}
function rarChips(items){
  const h=state.rarities.map(r=>{const t=items.filter(x=>x.c.rarityId===r.id).reduce((a,x)=>a+x.pct,0);
    return t>0?`<span class="chip" style="--rc:${r.color};--rt:${textOn(r.color)}">${esc(r.name)} ${pct(t)}</span>`:''}).reverse().join('');
  return h?`<div class="chs">${h}</div>`:'';
}
function pickIdx(ws){
  const t=ws.reduce((a,b)=>a+b,0);let x=rand()*t;
  for(let i=0;i<ws.length;i++){if(ws[i]>0){if(x<ws[i])return i;x-=ws[i]}}
  for(let j=ws.length-1;j>=0;j--)if(ws[j]>0)return j;
  return 0;
}
function drawPack(p){
  const pool=poolOf(p);
  const base=pool.map(x=>x.sold?0:x.w);
  if(!base.some(w=>w>0))return null;
  let ws=base.slice();const out=[];
  for(let i=0;i<p.size;i++){
    if(!ws.some(w=>w>0))break;
    const k=pickIdx(ws),c=pool[k].c;let ser=null;
    if(c.print>0){
      ser=rollSerial(c);
      if(ser==null){ws[k]=0;base[k]=0;i--;continue}
      giveSerial(c,ser);
      if(isSold(c)){ws[k]=0;base[k]=0}
    }
    out.push({c,ser});
    if(p.norep){ws[k]=0;if(!ws.some(w=>w>0))ws=base.slice()}
  }
  return out.length?out:null;
}
const sortedCards=()=>state.cards.slice().sort((a,b)=>{
  const sa=a.setId?state.sets.findIndex(s=>s.id===a.setId):999,sb=b.setId?state.sets.findIndex(s=>s.id===b.setId):999;
  return sa-sb||rarIdx(b)-rarIdx(a)||(a.name||'').localeCompare(b.name||'','pl')});

/* ===== toast + sheets ===== */
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2800)}
const sheetEl=$('#sheet'),stage=$('#stage'),viewer=$('#viewer');
let sheetClose=null;
const unlockIfIdle=()=>{if(sheetEl.hidden&&stage.hidden&&viewer.hidden)document.body.classList.remove('lock')};
function el(html){const d=document.createElement('div');d.innerHTML=html;return d}
function openSheet(node,onClose){
  sheetEl.innerHTML='';const box=document.createElement('div');box.className='box';box.appendChild(node);sheetEl.appendChild(box);
  sheetEl.hidden=false;document.body.classList.add('lock');sheetClose=onClose||null;
}
function closeSheet(){
  const cb=sheetClose;sheetClose=null;sheetEl.hidden=true;sheetEl.innerHTML='';unlockIfIdle();if(cb)cb();
}
sheetEl.addEventListener('click',e=>{if(e.target===sheetEl)closeSheet()});
function confirmSheet(msg,ok,danger){
  return new Promise(res=>{
    let done=false;
    const n=el(`<p class="cmsg">${esc(msg)}</p><div class="row"><button class="btn" data-x="0">Anuluj</button><button class="btn ${danger?'dng':'pri'}" data-x="1">${esc(ok||'OK')}</button></div>`);
    n.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;done=true;closeSheet();res(b.dataset.x==='1')});
    openSheet(n,()=>{if(!done)res(false)});
  });
}

function armDelete(b,label,fn){
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent=label||'Na pewno usunąć?';return}
  fn();
}

    $$('[data-col]',n).forEach(x=>x.classList.toggle('on',x.dataset.col===get()));paint()});

/* ===== images ===== */
const readAsDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)});
const loadImage=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=src});
function fileToCardImg(f){
  return readAsDataURL(f).then(loadImage).catch(()=>{if(window.createImageBitmap)return createImageBitmap(f);throw new Error('img')}).then(im=>{
    const W=600,H=840,c=document.createElement('canvas');c.width=W;c.height=H;
    const iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height,x=c.getContext('2d'),s=Math.max(W/iw,H/ih),dw=iw*s,dh=ih*s;
    x.fillStyle='#222';x.fillRect(0,0,W,H);x.drawImage(im,(W-dw)/2,(H-dh)*0.2,dw,dh);
    return c.toDataURL('image/jpeg',0.86);
  });
}
const nameFromFile=n=>n.replace(/\.[^.]+$/,'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim().slice(0,60)||'Nowa karta';

}

      if(d.setId==='__new'){const s={id:uid(),name:d._new.slice(0,40)};state.sets.push(s);d.setId=s.id}
      delete d._new;
      if(d.print>0&&base){const mx=Math.max(0,...takenOf(base));if(d.print<mx){d.print=mx;toast('Nakład nie może być mniejszy niż najwyższy już rozdany numer ('+mx+')')}}
      if(isNew)state.cards.push({...d,sample:false});else Object.assign(base,d,{sample:false});
      state.packs.forEach(p=>{
        const want=!!inP[p.id],has=p.entries.some(x=>x.id===d.id);
        if(want&&!has){const ws=p.entries.map(x=>x.w),avg=ws.length?Math.round(ws.reduce((a,x)=>a+x,0)/ws.length*100)/100:10;p.entries.push({id:d.id,w:avg||10})}
        if(!want&&has)p.entries=p.entries.filter(x=>x.id!==d.id);
      });
      save();closeSheet();render();return;
    }
    if(b.id==='cd')armDelete(b,'Na pewno usunąć?',()=>{removeCard(d.id);closeSheet();render()});
  });
  openSheet(n);paint();
}

/* ===== pack editor with per-card odds ===== */
function packSheet(id){
  const base=id?packById(id):null,isNew=!base;
  const d=base?{id:base.id,name:base.name,hue:base.hue,size:base.size,norep:!!base.norep,price:base.price||0,pub:base.pub!==false}
    :{id:uid(),name:'Paczka '+(state.packs.length+1),hue:HUES[state.packs.length%HUES.length],size:5,norep:false,price:0,pub:true};
  const W={};
  if(base)base.entries.forEach(e=>{W[e.id]=e.w});
  else{const k=state.cards.length;state.cards.forEach(c=>{W[c.id]=k?Math.round(10000/k)/100:0})}
  const rows=sortedCards().map(c=>`<div class="pr2" data-cid="${esc(c.id)}"><label><input type="checkbox" data-pick><span class="mini" style="width:34px">${cardHTML(c)}</span>
    <span class="nm">${esc(c.name||'Bez nazwy')}${chipHTML(rarOf(c))}</span></label>
    <span class="wbox"><input type="number" inputmode="decimal" min="0" max="1000" step="any" data-w aria-label="Szansa w procentach"><b>%</b><small class="eff"></small></span></div>`).join('');
  const n=el(`<h2>${isNew?'Nowa paczka':'Edytuj paczkę'}</h2>
   <label class="fl" for="pname">Nazwa paczki</label><input id="pname" type="text" maxlength="40" value="${esc(d.name)}">
   <div class="fl">Kolor</div><div class="sw hsw" id="sw">${HUES.map(h=>`<button type="button" data-h="${h}" style="--h:${h}" aria-label="Kolor"></button>`).join('')}</div>
   <div class="fl">Kart w jednej paczce</div><div class="stepper"><button type="button" id="mi" aria-label="Mniej">−</button><output id="sz"></output><button type="button" id="pl" aria-label="Więcej">+</button></div>
   <label class="chk" style="margin-top:10px"><input type="checkbox" id="ppub"${d.pub?' checked':''}><span>Widoczna dla graczy (odznacz, żeby została tylko u Ciebie)</span></label>
   <label class="chk" style="margin-top:10px"><input type="checkbox" id="norep"><span>Bez powtórzeń tej samej karty w jednej paczce</span></label>
   ${econOn()?`<label class="fl" for="pprice">Cena otwarcia paczki (${esc(state.econ.name)}, 0 = za darmo)</label><input id="pprice" type="number" inputmode="decimal" min="0" step="any" value="${d.price}">`:''}
   <div class="fl">Karty i szanse (%)</div>
   ${state.cards.length?`<div class="seg"><button type="button" id="all">Wszystkie</button><button type="button" id="none">Żadne</button><button type="button" id="eq">Po równo</button><button type="button" id="norm">Przelicz do 100%</button></div>
   ${state.sets.length?`<div class="chips" style="margin-top:8px">${state.sets.map(s=>`<button type="button" class="chip plain" data-addset="${esc(s.id)}">+ ${esc(s.name)}</button>`).join('')}</div>`:''}
   <div class="fl">Szansa na całą rzadkość (%)</div>
   <p class="muted" style="margin:0 0 8px;font-size:13px">Wpisz łączny procent dla rzadkości, a podzielę go między jej karty w tej paczce. Najliczniejsza rzadkość sama dopełnia do 100%.</p>
   ${state.rarities.slice().reverse().map(r=>`<div class="rrow">${chipHTML(r)}<span class="muted" data-rc="${esc(r.id)}"></span><input type="number" inputmode="decimal" min="0" max="100" step="any" data-rt="${esc(r.id)}" aria-label="Szansa na rzadkość ${esc(r.name)}"><b>%</b></div>`).join('')}
   <div class="fl">Szanse poszczególnych kart (%)</div>
   <div class="sumline" id="sumline"></div>${rows}`:'<p class="muted">Najpierw dodaj karty w zakładce Karty.</p>'}
   <div class="row"><button type="button" class="btn" id="px">Anuluj</button><button type="button" class="btn pri" id="ps">Zapisz</button></div>
   ${isNew?'':'<div class="row"><button type="button" class="btn dng" id="pd">Usuń paczkę</button></div>'}`);
  const total=()=>Object.keys(W).reduce((a,k)=>a+W[k],0);
  const fix=()=>{ /* make weights sum to exactly 100 (remainder goes to the largest) */
    const ks=Object.keys(W),s=total();if(!ks.length)return;
    if(s<=0){ks.forEach(k=>{W[k]=1});return fix()}
    ks.forEach(k=>{W[k]=Math.round(W[k]/s*1000000)/10000});
    const diff=Math.round((100-total())*10000)/10000,big=ks.reduce((a,k)=>W[k]>W[a]?k:a,ks[0]);W[big]=Math.round((W[big]+diff)*10000)/10000;
  };
  const refresh=(force)=>{
    $('#sz',n).textContent=d.size;$('#norep',n).checked=d.norep;
    $$('#sw button',n).forEach(b=>b.classList.toggle('on',+b.dataset.h===+d.hue));
    const s=total(),cnt=Object.keys(W).length;
    $$('.pr2',n).forEach(row=>{
      const cid=row.dataset.cid,on=cid in W,inp=$('[data-w]',row);
      $('[data-pick]',row).checked=on;inp.disabled=!on;
      if(!on){inp.value='';$('.eff',row).textContent=''}
      else{if(document.activeElement!==inp)inp.value=W[cid];$('.eff',row).textContent=(s>0&&Math.abs(s-100)>0.05)?'→ '+pct(W[cid]/s*100):''}
    });
    state.rarities.forEach(r=>{
      const ids=Object.keys(W).filter(id=>{const c=byId(id);return c&&c.rarityId===r.id});
      const inp=$$('[data-rt]',n).find(x=>x.dataset.rt===r.id),lab=$$('[data-rc]',n).find(x=>x.dataset.rc===r.id);
      if(!inp||!lab)return;
      inp.disabled=!ids.length;lab.textContent=ids.length+' '+plKart(ids.length)+' w paczce';
      if(!ids.length)inp.value='';
      else if(force||document.activeElement!==inp)inp.value=Math.round(ids.reduce((a,id)=>a+W[id],0)*10000)/10000;
    });
    const sl=$('#sumline',n);if(!sl)return;
    const ok=cnt&&Math.abs(s-100)<=0.05;
    sl.className='sumline'+(ok||!cnt?'':' bad');
    sl.textContent=!cnt?'Zaznacz karty, które mają być w paczce.':ok?`Suma szans: ${pct(s)}. Wszystko się zgadza.`:`Suma szans: ${pct(s)}. Przy losowaniu zostaną przeliczone proporcjonalnie. Kliknij „Przelicz do 100%”, jeśli chcesz to wyrównać.`;
  };
  const avg=()=>{const k=Object.keys(W);return k.length?Math.round(total()/k.length*100)/100:10};
  /* odds for a whole rarity: split among its cards, the biggest other rarity tops the sum up to 100 */
  const r4=x=>Math.round(x*10000)/10000;
  const selIds=rid=>Object.keys(W).filter(id=>{const c=byId(id);return c&&c.rarityId===rid});
  const sumOf=ids=>ids.reduce((a,id)=>a+W[id],0);
  const scaleTo=(ids,T)=>{
    const cur=sumOf(ids);ids.forEach(id=>{W[id]=r4(cur>0?W[id]*T/cur:T/ids.length)});
    const d=r4(T-sumOf(ids));
    if(d&&ids.length){const top=ids.reduce((a,id)=>W[id]>W[a]?id:a,ids[0]);if(W[top]+d>=0)W[top]=r4(W[top]+d)}
  };
  const setRarTotal=(rid,T)=>{
    const ids=selIds(rid);if(!ids.length)return;
    const was100=Math.abs(total()-100)<=0.05;
    let big=null,bigT=-1;
    state.rarities.forEach(r=>{const a=selIds(r.id);if(a.length&&sumOf(a)>bigT){big=r.id;bigT=sumOf(a)}});
    scaleTo(ids,T);
    if(!was100||big===rid)return;
    let abs=null,absT=0;
    state.rarities.forEach(r=>{if(r.id===rid)return;const a=selIds(r.id),t=sumOf(a);if(a.length&&t>absT){abs=a;absT=t}});
    if(!abs)return;
    scaleTo(abs,Math.max(0,absT+(100-total())));
    const rest=r4(100-total());
    if(Math.abs(rest)<0.01){const top=abs.reduce((a,id)=>W[id]>W[a]?id:a,abs[0]);if(W[top]+rest>=0)W[top]=r4(W[top]+rest)}
  };
  n.addEventListener('change',e=>{
    const t=e.target;
    if(t.matches&&t.matches('[data-rt]')){setRarTotal(t.dataset.rt,clamp(parseFloat(t.value)||0,0,100));refresh(true)}
  });
  n.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='pname')d.name=t.value;
    if(t.id==='norep')d.norep=t.checked;
    if(t.id==='ppub')d.pub=t.checked;
    if(t.id==='pprice')d.price=price(t.value);
    if(t.matches('[data-w]')){W[t.closest('.pr2').dataset.cid]=clamp(parseFloat(t.value)||0,0,1000);refresh()}
    if(t.matches('[data-pick]')){const cid=t.closest('.pr2').dataset.cid;if(t.checked)W[cid]=avg()||10;else delete W[cid];refresh()}
  });
  n.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.h){d.hue=+b.dataset.h;refresh();return}
    if(b.id==='mi'){d.size=Math.max(1,d.size-1);refresh();return}
    if(b.id==='pl'){d.size=Math.min(15,d.size+1);refresh();return}
    if(b.dataset.addset){const a=avg();state.cards.forEach(c=>{if(c.setId===b.dataset.addset&&!(c.id in W))W[c.id]=a||10});refresh();return}
    if(b.id==='all'){const a=avg();state.cards.forEach(c=>{if(!(c.id in W))W[c.id]=a||10});refresh();return}
    if(b.id==='none'){Object.keys(W).forEach(k=>delete W[k]);refresh();return}
    if(b.id==='eq'){const ks=Object.keys(W);if(ks.length){const base2=Math.floor(10000/ks.length)/100;ks.forEach(k=>{W[k]=base2});W[ks[0]]=Math.round((100-base2*(ks.length-1))*100)/100}refresh();return}
    if(b.id==='norm'){fix();refresh();return}
    if(b.id==='px'){closeSheet();return}
    if(b.id==='ps'){
      d.name=d.name.trim()||('Paczka '+(state.packs.length+(isNew?1:0)));
      const entries=state.cards.filter(c=>c.id in W).map(c=>({id:c.id,w:W[c.id]}));
      const rec={...d,entries,sample:false};
      if(isNew)state.packs.push(rec);else Object.assign(base,rec);
      sel=d.id;save();closeSheet();render();return;
    }
    if(b.id==='pd')armDelete(b,'Na pewno usunąć?',()=>{state.packs=state.packs.filter(p=>p.id!==d.id);save();closeSheet();render()});
  });
  openSheet(n);refresh();
}

function startOpen(pack){
  const cost=econOn()?(pack.price||0):0;
  if(cost>0&&state.coins<cost){toast('Za mało środków: potrzebujesz '+money(cost)+', masz '+money(state.coins));return}
  const pulled=drawPack(pack);if(!pulled){toast('Ta paczka jest pusta');return}
  if(cost>0)state.coins=r2(state.coins-cost);
  const before={};pulled.forEach(o=>{before[o.c.id]=state.owned[o.c.id]|0});
  const items=pulled.map(o=>({c:o.c,ser:o.ser,k:rand(),isNew:false}));
  items.sort((a,b)=>rarIdx(a.c)-rarIdx(b.c)||a.k-b.k);
  const seen={};items.forEach(it=>{it.isNew=!(before[it.c.id]>0)&&!seen[it.c.id];seen[it.c.id]=true;state.owned[it.c.id]=(state.owned[it.c.id]|0)+1});
  state.opened=(state.opened|0)+1;save();
  S={pack,items,phase:'pack',idx:0,flipped:false,busy:false};
  stage.hidden=false;document.body.classList.add('lock');stage.dataset.t='';stage.classList.remove('flash');paintStage();
}
function paintStage(){
  if(!S)return;
  const N=S.items.length,ph=S.phase;let html='<div class="glow"></div>';
  html+=`<div class="stop"><span class="scount">${ph==='deck'?(S.idx+1)+' / '+N:''}</span><span class="sbtns">${ph==='deck'?'<button class="sbtn" data-act="skip">Pomiń</button>':''}<button class="sbtn" data-act="closestage">Zamknij</button></span></div>`;
  if(ph==='pack'){
    html+=`<div class="scenter"><span class="pack bigpack" id="bp" data-act="tear" style="--h:${+S.pack.hue||345}"><span class="strip"></span><span class="pn">${esc(S.pack.name)}</span><span class="pc">${S.pack.size} ${plKart(S.pack.size)}</span></span></div><p class="shint">Dotknij paczki, aby ją otworzyć</p>`;
  }else if(ph==='deck'){
    let slots='';
    for(let k=Math.min(S.idx+2,N-1);k>=S.idx;k--){
      const pos=k-S.idx;
      slots+=`<div class="slot p${pos}"><div class="dc${pos===0&&S.flipped?' flipped':''}"><div class="face back" style="--h:${+S.pack.hue||345}"><span class="bk">?</span></div><div class="face front">${cardHTML(S.items[k].c,{lg:true,ser:S.items[k].ser})}</div></div></div>`;
    }
    html+=`<div class="scenter"><div class="deck" data-act="deck">${slots}</div></div><p class="shint">${S.flipped?(S.idx===N-1?'Dotknij, aby zobaczyć podsumowanie':'Dotknij, aby przejść dalej'):'Dotknij karty, aby ją odkryć'}</p>`;
  }else{
    const best=S.items.reduce((m,it)=>rarIdx(it.c)>rarIdx(m)?it.c:m,S.items[0].c);
    html+=`<div class="sum"><h2>Wylosowane karty</h2><p class="best">Najlepsza: ${chipHTML(rarOf(best))}</p><div class="sumgrid">`
      +S.items.slice().reverse().map(it=>`<button class="cb" data-act="zoom" data-id="${esc(it.c.id)}" data-ser="${it.ser||''}">${cardHTML(it.c,{ser:it.ser,badge:it.isNew?'<span class="new">NOWA</span>':''})}</button>`).join('')
      +`</div></div><div class="sact"><button class="btn" data-act="closestage">Zamknij</button><button class="btn pri" data-act="again">Otwórz kolejną</button></div>`;
  }
  stage.innerHTML=html;
}
function burst(tier,color){
  if(tier<1)return;
  const n=tier>=3?38:tier===2?20:9,cols=['#ffffff',color,color,'#ffd36b'];
  const b=document.createElement('div');b.className='burst';
  for(let i=0;i<n;i++){
    const a=rand()*Math.PI*2,dist=70+rand()*(tier>=3?190:130),it=document.createElement('i');
    it.style.setProperty('--dx',Math.round(Math.cos(a)*dist)+'px');it.style.setProperty('--dy',Math.round(Math.sin(a)*dist)+'px');
    it.style.setProperty('--c',cols[i%cols.length]);b.appendChild(it);
  }
  const c=stage.querySelector('.scenter');if(c){c.appendChild(b);setTimeout(()=>b.remove(),1100)}
}
function tear(){
  if(!S||S.phase!=='pack'||S.busy)return;S.busy=true;
  const bp=$('#bp');bp.classList.add('shake');
  setTimeout(()=>{if(!S)return;bp.classList.remove('shake');bp.classList.add('torn');stage.classList.add('flash')},650);
  setTimeout(()=>{if(!S)return;stage.classList.remove('flash');S.phase='deck';S.busy=false;paintStage()},1150);
}
function deckTap(){
  if(!S||S.phase!=='deck'||S.busy)return;
  const N=S.items.length,it=S.items[S.idx];
  if(!S.flipped){
    S.flipped=true;const dc=stage.querySelector('.slot.p0 .dc');if(dc)dc.classList.add('flipped');
    const t=tierOf(it.c),col=rarOf(it.c).color;
    stage.style.setProperty('--sc',col);stage.dataset.t=t>=1?String(t):'';burst(t,col);
    const h=stage.querySelector('.shint');if(h)h.textContent=S.idx===N-1?'Dotknij, aby zobaczyć podsumowanie':'Dotknij, aby przejść dalej';
  }else{
    S.busy=true;const s=stage.querySelector('.slot.p0');if(s)s.classList.add('gone');
    setTimeout(()=>{if(!S)return;S.idx++;S.flipped=false;S.busy=false;stage.dataset.t='';if(S.idx>=N)S.phase='summary';paintStage()},280);
  }
}
function closeStage(){stage.hidden=true;stage.innerHTML='';stage.dataset.t='';S=null;unlockIfIdle();render()}

/* ===== 3D viewer: drag to rotate, tap to flip ===== */
let V=null;
function viewerOpen(src,ser){
  const c=typeof src==='string'?byId(src):src;if(!c)return;
  V={c,ry:0,rx:0,drag:null,moved:false};
  const r=rarOf(c),f=fontOf(c.font),st=setOf(c),fxn=(c.effectIds||[]).map(effById).filter(Boolean).map(e=>e.name);
  const own=state.owned[c.id]|0,mine=(state.serials[c.id]||[]).slice().sort((a,b)=>a-b);
  if(!ser&&c.print>0&&mine.length===1)ser=mine[0];
  const serInfo=c.print>0?`<div class="vl">Nakład: <b>${c.print}</b>${state.cards.includes(c)?` · wolnych: ${Math.max(0,c.print-takenOf(c).length)}`:''}</div>${mine.length?`<div class="vl">Twoje numery: <b>${mine.map(n=>'#'+serNum(n,c.print)).join(', ')}</b></div>`:''}`:'';
  viewer.innerHTML=`<div class="vtop"><button class="sbtn" data-act="vflip">Obróć kartę</button><button class="sbtn" data-act="vclose">Zamknij</button></div>
   <div class="vstage" id="vstage"><div class="vwrap"><div class="v3d tilt" id="v3d"><div class="vface">${cardHTML(c,{lg:true,ser})}</div>
   <div class="vface vbackf" style="--rc:${r.color};--rt:${textOn(r.color)};--cf:'${f.k}',sans-serif;--cw:${f.w};--fm:${f.m}">
    <div class="vn">${esc(c.name||'Bez nazwy')}</div>${chipHTML(r)}
    ${st?`<div class="vl">Kolekcja: <b>${esc(st.name)}</b></div>`:''}
    ${fxn.length?`<div class="vl">Dodatki: ${esc(fxn.join(', '))}</div>`:''}
    ${serInfo}<div class="vl">${own?'Masz ×'+own:'Jeszcze nie wylosowana'}</div></div></div></div></div>
   <p class="vhint">Przeciągnij, aby obrócić. Dotknij, aby odwrócić.</p>`;
  viewer.hidden=false;document.body.classList.add('lock');applyV();
}
function applyV(){
  const e=$('#v3d');if(!e||!V)return;
  e.style.transform=`rotateX(${V.rx}deg) rotateY(${V.ry}deg)`;
  const nrm=((V.ry%360)+540)%360-180;
  e.style.setProperty('--gx',(50+clamp(nrm,-70,70)*.6)+'%');e.style.setProperty('--gy',(50-V.rx*.9)+'%');
}
function viewerClose(){viewer.hidden=true;viewer.innerHTML='';V=null;unlockIfIdle()}
viewer.addEventListener('pointerdown',e=>{
  if(!V||!e.target.closest('#vstage'))return;
  V.drag={x:e.clientX,y:e.clientY,ry:V.ry,rx:V.rx};V.moved=false;$('#v3d').classList.add('drag');
  try{$('#vstage').setPointerCapture(e.pointerId)}catch(_){}
});
viewer.addEventListener('pointermove',e=>{
  if(!V||!V.drag)return;
  const dx=e.clientX-V.drag.x,dy=e.clientY-V.drag.y;if(Math.abs(dx)+Math.abs(dy)>6)V.moved=true;
  V.ry=V.drag.ry+dx*0.7;V.rx=clamp(V.drag.rx-dy*0.4,-40,40);applyV();
});
const vEnd=()=>{
  if(!V||!V.drag)return;V.drag=null;const e=$('#v3d');if(e)e.classList.remove('drag');
  if(!V.moved)V.ry+=180;V.ry=Math.round(V.ry/180)*180;V.rx=0;applyV();
};
viewer.addEventListener('pointerup',vEnd);viewer.addEventListener('pointercancel',vEnd);

/* ===== backup ===== */
function importFromText(txt){
  let clean;
  try{
    const j=JSON.parse(String(txt).trim());
    if(CATALOG){if(!j||j.app!=='celebrity-clash-progress')throw new Error('bad');clean=normalize({...CATALOG,owned:j.owned,serials:j.serials,taken:j.taken,opened:j.opened,coins:j.coins})}
    else{if(!j||!Array.isArray(j.cards)||!Array.isArray(j.packs))throw new Error('bad');clean=normalize(j)}
  }catch(e){toast('To nie wygląda na kopię Pack Openera');return Promise.resolve()}
  return confirmSheet(CATALOG?'Wczytanie kopii zastąpi Twój obecny album.':'Wczytanie kopii zastąpi wszystkie obecne karty, paczki i album.','Wczytaj',true).then(ok=>{
    if(!ok)return;state=clean;sel=null;albumSet='all';albumRar='all';cardFilter='all';save();render();toast('Kopia wczytana');
  });
}
function catalogJSON(){
  const cards=state.cards.filter(c=>c.pub!==false).map(c=>({...c,sample:false}));
  const ids=new Set(cards.map(c=>c.id));
  const packs=state.packs.filter(p=>p.pub!==false).map(p=>({...p,sample:false,entries:p.entries.filter(e=>ids.has(e.id))})).filter(p=>p.entries.length);
  return JSON.stringify({app:'celebrity-clash-catalog',v:2,rev:Date.now(),cards,sets:state.sets,rarities:state.rarities,effects:state.effects,fxv:state.fxv,packs,econ:state.econ});
}
function copyCatalog(){
  const data=catalogJSON();
  const manual=()=>{const box=$('#pastebox');if(box){box.value=data;box.focus();box.select()}toast('Zaznacz tekst w polu i skopiuj go ręcznie')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(data).then(()=>toast('Katalog dla graczy skopiowany')).catch(manual);
  else manual();
}
const progressJSON=()=>JSON.stringify({app:'celebrity-clash-progress',exported:new Date().toISOString(),owned:state.owned,serials:state.serials,taken:state.taken,opened:state.opened,coins:state.coins});
function copyBackup(){
  const data=CATALOG?progressJSON():JSON.stringify({app:'pack-opener',exported:new Date().toISOString(),...state});
  const manual=()=>{const box=$('#pastebox');if(box){box.value=data;box.focus();box.select()}toast('Zaznacz tekst w polu i skopiuj go ręcznie')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(data).then(()=>toast('Kopia skopiowana. Wklej ją w drugim miejscu.')).catch(manual);
  else manual();
}
function exportBackup(){
  const data=CATALOG?progressJSON():JSON.stringify({app:'pack-opener',exported:new Date().toISOString(),...state});
  const useP=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads'):Promise.resolve(null);
  useP.catch(()=>null).then(dl=>{
    if(dl)return dl.save({filename:'pack-opener-kopia.json',data}).then(()=>toast('Kopia zapisana')).catch(err=>{if(err&&err.code!=='declined')toast('Nie udało się zapisać pliku')});
    if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(data).then(()=>toast('Kopia skopiowana do schowka')).catch(()=>toast('Zapis kopii nie działa w tym widoku'));
    toast('Zapis kopii nie działa w tym widoku');
  });
}
document.addEventListener('change',e=>{
  const t=e.target;if(!t.matches)return;
  if(t.matches('[data-econ]')){
    const k=t.dataset.econ;
    if(k==='on')state.econ.on=t.checked;
    if(k==='sellLast')state.econ.sellLast=t.checked;
    if(k==='name')state.econ.name=(t.value.trim()||'monet').slice(0,20);
    if(k==='coins')state.coins=price(t.value);
    save();render();return;
  }
  if(t.matches('[data-import]')){
    const f=t.files&&t.files[0];t.value='';if(!f)return;
    f.text().then(importFromText).catch(()=>toast('Nie udało się odczytać pliku'));
  }
  if(t.matches('[data-photos]')){
    const files=Array.from(t.files||[]);t.value='';if(!files.length)return;
    const made=[];let fail=0,i=0,lastErr='';
    const say=m=>{const p=$('#pmsg');if(p){p.hidden=!m;p.textContent=m}toast(m)};
    say('Wybrano plików: '+files.length+'. Wczytuję…');
    (function next(){
      if(i>=files.length){
        if(!made.length){say('Nie udało się wczytać zdjęć'+(lastErr?' ('+lastErr+')':'')+'. Spróbuj JPG lub PNG.');return}
        state.cards=state.cards.concat(made);save();render();say('Dodano kart: '+made.length+(fail?', błędów: '+fail:''));assignSheet(made,fail);return;
      }
      say('Wczytuję zdjęcie '+(i+1)+' z '+files.length+'…');
      const f=files[i++];
      fileToCardImg(f).then(img=>{made.push({id:uid(),name:nameFromFile(f.name),rarityId:state.rarities[0].id,setId:null,effectIds:[],font:'Manrope',img})})
        .catch(err=>{fail++;lastErr=(err&&err.message)||'błąd'}).then(next);
    })();
  }
});

/* ===== events ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id,k=t.dataset.k;
  switch(a){
    case 'tab':tab=t.dataset.tab;render();window.scrollTo(0,0);break;
    case 'selpack':sel=id;render();break;
    case 'openpack':{const p=packById(sel);if(p)startOpen(p);break}
    case 'tear':tear();break;
    case 'deck':deckTap();break;
    case 'skip':if(S){S.phase='summary';stage.dataset.t='';paintStage()}break;
    case 'again':if(S){startOpen(packById(S.pack.id)||S.pack)}break;
    case 'closestage':closeStage();break;
    case 'newpack':packSheet(null);break;
    case 'editpack':packSheet(id);break;
    case 'newcard':cardSheet(null);break;
    case 'editcard':cardSheet(id);break;
    case 'copycatalog':copyCatalog();break;
    case 'zoom':viewerOpen(id,+t.dataset.ser||0);break;
    case 'vflip':if(V){V.ry+=180;V.ry=Math.round(V.ry/180)*180;applyV()}break;
    case 'vclose':viewerClose();break;
    case 'albumset':albumSet=k;render();break;
    case 'albumrar':albumRar=k;render();break;
    case 'cardset':cardFilter=k;render();break;
    case 'newset':setSheet(null);break;
    case 'editset':setSheet(id);break;
    case 'newrar':raritySheet(null);break;
    case 'editrar':raritySheet(id);break;
    case 'rup':moveRarity(id,-1);break;
    case 'rdown':moveRarity(id,1);break;
    case 'newfx':fxSheet(null);break;
    case 'editfx':fxSheet(id);break;
    case 'rmsample':
      state.cards.filter(c=>c.sample).map(c=>c.id).forEach(removeCard);
      state.packs=state.packs.filter(p=>!(p.sample&&p.entries.length===0));
      save();render();toast('Usunięto przykładowe karty');break;
    case 'sell1':sellCard(id,1);break;
    case 'sellN':sellCard(id,Infinity);break;
    case 'sellall':sellAll();break;
    case 'buy':buyCard(id);break;
    case 'export':exportBackup();break;
    case 'copybackup':copyBackup();break;
    case 'pasteimport':{const box=$('#pastebox');if(!box||!box.value.trim()){toast('Najpierw wklej tekst kopii w pole');break}importFromText(box.value);break}
    case 'resetcoll':confirmSheet('Wyzerować album? Karty i paczki zostaną.','Wyzeruj',true).then(ok=>{if(ok){state.owned={};state.serials={};state.taken={};state.opened=0;save();render();toast('Album wyzerowany')}});break;
    case 'wipe':confirmSheet('Usunąć wszystkie karty, paczki, kolekcje i album? Tego nie da się cofnąć.','Usuń wszystko',true).then(ok=>{if(ok){state=emptyState();sel=null;albumSet='all';albumRar='all';cardFilter='all';save();render();toast('Wszystko usunięte')}});break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!viewer.hidden)viewerClose();else if(!sheetEl.hidden)closeSheet();else if(!stage.hidden)closeStage();
});

/* ===== boot ===== */
if(CATALOG)state=normalize(CATALOG);
render();
if(CATALOG)idbGet('progress').catch(()=>{persistOk=false;return null}).then(pr=>{
  state=normalize(Object.assign({},CATALOG,pr||{}));render();
});
else idbGet('state').catch(()=>{persistOk=false;return null}).then(s=>{
  if(s&&Array.isArray(s.cards)&&Array.isArray(s.packs)){
    const old=!(s.v>=2);
    if(old)idbPut('state_v1',s).catch(()=>{});
    state=normalize(s);if(old)save();
  }else{seed();save()}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  render();
});
})();
</script>
